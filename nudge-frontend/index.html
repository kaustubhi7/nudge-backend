<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudge</title>

    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<!-- Toast -->
<div id="toast"></div>

<!-- QR Modal -->
<div id="qrModal" class="modal-overlay" onclick="closeQR()">
    <div class="modal-box" onclick="event.stopPropagation()">
        <h3>QR Code</h3>
        <div id="qrCode"></div>
        <p id="qrUrl"></p>
        <button onclick="closeQR()">Close</button>
    </div>
</div>

<div class="container">

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <h1>Nudge</h1>
            <p>Beam content instantly</p>
        </div>
        <div class="header-right">
            <span id="clipCount">0 items</span>
            <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">☀️</button>
        </div>
    </div>

    <!-- Input Section -->
    <div class="input-section">

        <textarea
                id="inputBox"
                placeholder="Paste your text or link here...">
        </textarea>

        <div class="action-row">
            <label class="img-upload-btn" title="Upload Image">
                🖼️ Image
                <input type="file" id="imageInput" accept="image/*" onchange="saveImage()" hidden>
            </label>
            <button onclick="saveClip()">Nudge</button>
            <button class="danger" onclick="clearAll()">Clear All</button>
        </div>

    </div>

    <!-- History Section -->
    <div class="history-section">

        <div class="history-title">Recent Nudges</div>

        <div id="clipList">
            <div class="empty-state">
                Nothing nudged yet.<br>
                Paste something above.
            </div>
        </div>

    </div>

</div>

<!-- Mobile Bottom Bar -->
<div class="mobile-bar">
    <textarea id="mobileInput" placeholder="Paste here..."></textarea>
    <button onclick="saveMobileClip()">Nudge</button>
</div>

<script src="app.js"></script>
</body>
</html>
