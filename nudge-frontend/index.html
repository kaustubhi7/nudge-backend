<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudge</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">

    <div class="header">
        <h1>👋 Nudge</h1>
        <p>Beam content from your phone to your PC instantly</p>
    </div>

    <div class="input-area">
        <textarea id="inputBox" placeholder="Paste your text or link here..."></textarea>
        <button onclick="saveClip()">Nudge it →</button>
    </div>

    <div class="toolbar">
        <span id="clipCount">0 items</span>
        <button class="danger" onclick="clearAll()">Clear All</button>
    </div>

    <div id="clipList"></div>

</div>
<script src="app.js"></script>
</body>
</html>
